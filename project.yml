name: TruVideoSDK
options:
  createIntermediateGroups: true
  fileHeaderTemplate: |
    //
    // Copyright © {{year}} TruVideo. All rights reserved.
    //  

packages:
  AWSS3:
    url: https://github.com/awslabs/aws-sdk-swift
    from: 1.3.51

targets:
  Core:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Core/Sources
    info:
      path: Libraries/Internal/Core/Sources/Info.plist
    scheme:
      testTargets:
        - CoreTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Core/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  CoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Core/Tests
    dependencies:
      - target: Core
    settings:
      GENERATE_INFOPLIST_FILE: YES

  CoreDataUtilities:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/CoreDataUtilities/Sources
    info:
      path: Libraries/Internal/CoreDataUtilities/Sources/Info.plist
    scheme:
      testTargets:
        - CoreDataUtilitiesTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/CoreDataUtilities/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  CoreDataUtilitiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/CoreDataUtilities/Tests
    dependencies:
      - target: CoreDataUtilities
    settings:
      GENERATE_INFOPLIST_FILE: YES

  DI:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/DI/Sources
    info:
      path: Libraries/Internal/DI/Sources/Info.plist
    scheme:
      testTargets:
        - DITests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/DI/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  DITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/DI/Tests
    dependencies:
      - target: DI
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Networking:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Networking/Sources
    info:
      path: Libraries/Internal/Networking/Sources/Info.plist
    scheme:
      testTargets:
        - NetworkingTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Networking/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  NetworkingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Networking/Tests
    dependencies:
      - target: Networking
      - target: NetworkingInteropTesting
    settings:
      GENERATE_INFOPLIST_FILE: YES
  
  NetworkingInterop:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Networking/Interop/Sources
    info:
      path: Libraries/Internal/Networking/Interop/Sources/Info.plist
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
