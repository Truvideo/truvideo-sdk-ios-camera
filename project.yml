          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
        
  NetworkingInteropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Networking/Interop/Tests
    dependencies:
      - target: NetworkingInterop
      - target: NetworkingInteropTesting
    settings:
      GENERATE_INFOPLIST_FILE: YES

  NetworkingInteropTesting:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Networking/Interop/Testing
    info:
      path: Libraries/Internal/Networking/Interop/Testing/Info.plist
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Networking/Interop/Testing" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  Telemetry:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Telemetry/Sources
    info:
      path: Libraries/Internal/Telemetry/Sources/Info.plist
    scheme:
      testTargets:
        - TelemetryTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Telemetry/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
    dependencies:
      - package: AWSS3

  TelemetryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Telemetry/Tests
    dependencies:
      - target: Telemetry
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Utilities:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Utilities/Sources
    info:
      path: Libraries/Internal/Utilities/Sources/Info.plist
    scheme:
      testTargets:
        - UtilitiesTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Utilities/Sources" -i
