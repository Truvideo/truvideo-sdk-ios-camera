name: TruvideoSDK
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

packages:
  AWSS3:
    url: https://github.com/aws-amplify/aws-sdk-ios-spm
    exactVersion: 2.33.4
  Common:
    url: https://github.com/Truvideo/truvideo-sdk-ios-common
    from: 0.0.78
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.5.0
  TruvideoSdkVideoUtils:
    url: https://github.com/Truvideo/truvideo-sdk-ios-video-utils
    exactVersion: 0.0.3

targetTemplates:
  cameraExampleDeps:
    dependencies:
      - target: TruvideoSdkCamera
        embed: true
      - target: TruvideoSdk
        embed: true
      - package: TruvideoSdkVideoUtils
        product: TruvideoSdkVideoUtils
      - package: Common
        product: Common
      - package: AWSS3
        product: AWSS3
      - package: AWSS3
        product: AWSCore
      - package: AWSS3
        product: AWSCognitoIdentityProvider

targets:
  # Foundation Core (Low-level infrastructure)
  DI:
    type: library.static
    platform: iOS
    sources:
      - Libraries/Foundation/Core/DI/Sources
    info:
      path: Libraries/Foundation/Core/DI/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: DI
    scheme:
      testTargets:
        - DITests
    postCompileScripts:
      - script: |
          export PATH="/opt/homebrew/bin:$PATH"
          if which swiftformat >/dev/null; then
            swiftformat .
          else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if [ -f /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint
          elif [ -f /usr/local/bin/swiftlint ]; then
            /usr/local/bin/swiftlint
          elif which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  DITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Core/DI/Tests
    dependencies:
      - target: DI
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Registry:
