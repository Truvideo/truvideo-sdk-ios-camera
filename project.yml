  UtilitiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Utilities/Tests
    dependencies:
      - target: Utilities
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  Core:
    build:
      targets:
        Core: all
    test:
      targets: [CoreTests]
  CoreDataUtilities:
    build:
      targets:
        CoreDataUtilities: all
    test:
      targets: [CoreDataUtilitiesTests]
  DI:
    build:
      targets:
        DI: all
    test:
      targets: [DITests]
  Networking:
    build:
      targets:
        Networking: all
    test:
      targets: all
  NetworkingInterop:
    build:
      targets:
        NetworkingInterop: all
    test:
      targets: [NetworkingInteropTests]
  NetworkingInteropTesting:
    build:
      targets:
        NetworkingInterop: all
  Telemetry:
    build:
      targets:
        Telemetry: all
    test:
      targets: [TelemetryTests]
  Utilities:
    build:
      targets:
        Utilities: all
    test:
      targets: [UtilitiesTests] 
