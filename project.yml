name: TruVideoSDK
options:
  createIntermediateGroups: true

packages:
  AWSS3:
    url: https://github.com/awslabs/aws-sdk-swift
    from: 1.3.51
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  # Foundation Core (Low-level infrastructure)
  DI:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Core/DI/Sources
    info:
      path: Libraries/Foundation/Core/DI/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: DI
    scheme:
      testTargets:
        - DITests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Core/DI/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  DITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Core/DI/Tests
    dependencies:
      - target: DI
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Registry:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Registry/Sources
    info:
      path: Libraries/Foundation/Core/Registry/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: Registry
    scheme:
      testTargets:
        - RegistryTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Core/Registry/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  RegistryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Registry/Tests
    dependencies:
      - target: Registry
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Storage:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Storage/Sources
    info:
      path: Libraries/Foundation/Core/Storage/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: Storage
    dependencies:
      - package: KeychainAccess
    scheme:
      testTargets:
        - StorageTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Core/Storage/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  StorageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Storage/Tests
    dependencies:
      - target: Storage
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Utilities:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Utilities/Sources
    info:
      path: Libraries/Foundation/Core/Utilities/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: Utilities
    scheme:
      testTargets:
        - UtilitiesTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Core/Utilities/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  UtilitiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Core/Utilities/Tests
    dependencies:
      - target: Utilities
    settings:
      GENERATE_INFOPLIST_FILE: YES

  # Foundation Extended (Built on Core)
  CoreDataUtilities:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Extended/CoreDataUtilities/Sources
    info:
      path: Libraries/Foundation/Extended/CoreDataUtilities/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: CoreDataUtilities
    dependencies:
      - target: DI
      - target: Utilities
    scheme:
      testTargets:
        - CoreDataUtilitiesTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Extended/CoreDataUtilities/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  CoreDataUtilitiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Extended/CoreDataUtilities/Tests
    dependencies:
      - target: CoreDataUtilities
    settings:
      GENERATE_INFOPLIST_FILE: YES

  Telemetry:
    type: framework
    platform: iOS
    sources:
      - Libraries/Foundation/Extended/Telemetry/Sources
    info:
      path: Libraries/Foundation/Extended/Telemetry/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: Telemetry
    dependencies:
      - target: DI
      - target: Registry
      - target: Storage
      - target: Utilities
      - package: AWSS3
    scheme:
      testTargets:
        - TelemetryTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Foundation/Extended/Telemetry/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  TelemetryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Foundation/Extended/Telemetry/Tests
    dependencies:
      - target: Telemetry
    settings:
      GENERATE_INFOPLIST_FILE: YES

  # Internal Core (Business Logic Infrastructure)
  Networking:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Core/Networking/Sources
    info:
      path: Libraries/Internal/Core/Networking/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: Networking
    dependencies:
      - target: DI
      - target: Registry
      - target: Utilities
    scheme:
      testTargets:
        - NetworkingTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Core/Networking/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  NetworkingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Core/Networking/Tests
    dependencies:
      - target: Networking
    settings:
      GENERATE_INFOPLIST_FILE: YES

  NetworkingTesting:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Core/Networking/Testing
    info:
      path: Libraries/Internal/Core/Networking/Testing/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: NetworkingTesting
    dependencies:
      - target: Networking
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Core/Networking/Testing" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  # Internal Extended (Business Logic)
  TruVideoApi:
    type: framework
    platform: iOS
    sources:
      - Libraries/Internal/Extended/TruVideoApi/Sources
    info:
      path: Libraries/Internal/Extended/TruVideoApi/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: TruVideoApi
    dependencies:
      - target: DI
      - target: Registry
      - target: Utilities
      - target: Telemetry
      - target: Networking
    scheme:
      testTargets:
        - TruVideoApiTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/Internal/Extended/TruVideoApi/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  TruVideoApiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/Internal/Extended/TruVideoApi/Tests
    dependencies:
      - target: NetworkingTesting
      - target: TruVideoApi
    settings:
      GENERATE_INFOPLIST_FILE: YES

  # External Core (Shared Dependencies)
  ExternalUtilities:
    type: framework
    platform: iOS
    sources:
      - Libraries/External/Core/Utilities/Sources
    info:
      path: Libraries/External/Core/Utilities/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: ExternalUtilities
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/External/Core/Utilities/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  # External Extended 
  TruvideoSdkCamera:
    type: framework
    platform: iOS
    sources:
      - Libraries/External/Extended/Camera/Sources
    info:
      path: Libraries/External/Extended/Camera/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: TruvideoSdkCamera
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/External/Extended/Camera/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  TruvideoSdkCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/External/Extended/Camera/Tests
    dependencies:      
      - target: TruvideoSdkCamera
    settings:
      GENERATE_INFOPLIST_FILE: YES

  # App
  TruvideoSdk:
    type: framework
    platform: iOS
    sources:
      - Libraries/App/Sources
    info:
      path: Libraries/App/Sources/Info.plist
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: TruvideoSdk
    dependencies:
      - target: ExternalUtilities
      - target: Registry
      - target: TruVideoApi
    scheme:
      testTargets:
        - TruvideoSdkTests
    postCompileScripts:
      - script: |
          if which swift-format > /dev/null; then
            swift-format format -r "${SRCROOT}/Libraries/App/Sources" -i
          else
            echo "warning: swift-format not installed, install with: brew install swift-format"
          fi
        name: SwiftFormat
        basedOnDependencyAnalysis: false
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false

  TruvideoSdkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Libraries/App/Tests
    dependencies:
      - target: TruvideoSdk
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  # Foundation Core Schemes
  DI:
    build:
      targets:
        DI: all
    test:
      targets: [DITests]
  Registry:
    build:
      targets:
        Registry: all
    test:
      targets: [RegistryTests]
  Storage:
    build:
      targets:
        DI: all
        Utilities: all
        Storage: all
    test:
      targets: [StorageTests]
  Utilities:
    build:
      targets:
        Utilities: all
    test:
      targets: [UtilitiesTests]
  
  # Foundation Extended Schemes
  CoreDataUtilities:
    build:
      targets:
        DI: all
        Utilities: all
        CoreDataUtilities: all
    test:
      targets: [CoreDataUtilitiesTests]
  Telemetry:
    build:
      targets:
        DI: all
        Registry: all
        Utilities: all
        Telemetry: all
    test:
      targets: [TelemetryTests]
  
  # Internal Core Schemes
  Networking:
    build:
      targets:
        DI: all
        Registry: all
        Utilities: all
        Networking: all
    test:
      targets: [NetworkingTests]
  
  NetworkingTesting:
    build:
      targets:
        DI: all        
        Utilities: all
        Networking: all
        NetworkingTesting: all
  
  # Internal Extended Schemes
  TruVideoApi:
    build:
      targets:
        DI: all        
        Utilities: all
        Networking: all
        TruVideoApi: all
    test:
      targets: [TruVideoApiTests] 

  # External Core (Shared Dependencies)
  ExternalUtilities:
    build:
      targets:
        ExternalUtilities: all
        Utilities: all

  # External Extended Schemes
  TruvideoSdkCamera:
    build:
      targets:
        TruvideoSdkCamera: all
    test:
      targets: [TruvideoSdkCameraTests]

  # App
  TruvideoSdk:
    build:
      targets:
        ExternalUtilities: all
        Registry: all
        TruVideoApi: all
        TruvideoSdk: all
    test:
      targets: [TruvideoSdkTests] 
